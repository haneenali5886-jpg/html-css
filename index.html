<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Task List</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f172a; /* خلفية كحلي داكن مريح للعين */
    color: #f1f5f9;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }
  .container { width: 100%; max-width: 490px; }
  h1 { font-size: 26px; margin: 0 0 6px 0; color: #f8fafc; }
  .subtitle { color: #94a3b8; font-size: 14px; margin: 0 0 24px 0; }
  
  .add-row { display: flex; gap: 10px; margin-bottom: 16px; }
  #taskInput {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #taskInput:focus { border-color: #818cf8; }
  
  #addBtn {
    background: #6366f1; /* بنفسجي هادئ */
    border: none;
    color: #ffffff;
    font-weight: 700;
    padding: 0 22px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #addBtn:hover { background: #4f46e5; }
  
  .filters { display: flex; gap: 10px; margin-bottom: 20px; }
  .filter-btn {
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .filter-btn.active {
    background: #818cf8;
    color: #ffffff;
    border-color: #818cf8;
  }
  
  .task-list { display: flex; flex-direction: column; gap: 12px; }
  .task-item {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .task-text { font-size: 14px; cursor: pointer; color: #e2e8f0; }
  .task-item.done .task-text { color: #64748b; text-decoration: line-through; }
  .task-right { display: flex; align-items: center; gap: 16px; }
  
  .status { font-size: 13px; font-weight: 600; cursor: pointer; }
  .status.done { color: #34d399; }    /* أخضر نعناعي هادئ */
  .status.pending { color: #fbbf24; } /* برتقالي دافئ هادئ */
  
  .delete-btn {
    background: none;
    border: none;
    color: #f87171; /* أحمر هادئ */
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📝 Task List</h1>
  <p class="subtitle">JS recap demo</p>

  <div class="add-row">
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <button id="addBtn">Add</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="pending">Pending</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>

  <div class="task-list" id="taskList"></div>
</div>

<script>
  let tasks = [
    { id: 1, text: "software testeng", done: true },
    { id: 2, text: "task2", done: false },
    { id: 3, text: "front end", done: false }
  ];
  let currentFilter = "all";
  let nextId = 4;

  const taskListEl = document.getElementById("taskList");
  const taskInput = document.getElementById("taskInput");
  const addBtn = document.getElementById("addBtn");
  const filterBtns = document.querySelectorAll(".filter-btn");

  function render() {
    taskListEl.innerHTML = "";
    const filtered = tasks.filter(function(t) {
      if (currentFilter === "pending") return !t.done;
      if (currentFilter === "done") return t.done;
      return true;
    });

    filtered.forEach(function(task) {
      const item = document.createElement("div");
      item.className = "task-item" + (task.done ? " done" : "");
      item.innerHTML =
        '<span class="task-text">' + task.text + '</span>' +
        '<div class="task-right">' +
          '<span class="status ' + (task.done ? "done" : "pending") + '">' +
            (task.done ? "Done" : "Pending") +
          '</span>' +
          '<button class="delete-btn">X</button>' +
        '</div>';

      item.querySelector(".task-text").addEventListener("click", function() { toggleDone(task.id); });
      item.querySelector(".status").addEventListener("click", function() { toggleDone(task.id); });
      item.querySelector(".delete-btn").addEventListener("click", function() { deleteTask(task.id); });

      taskListEl.appendChild(item);
    });
  }

  function addTask() {
    const value = taskInput.value.trim();
    if (!value) return;
    tasks.push({ id: nextId++, text: value, done: false });
    taskInput.value = "";
    render();
  }

  function toggleDone(id) {
    tasks = tasks.map(function(t) {
      if (t.id === id) { t.done = !t.done; }
      return t;
    });
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(function(t) { return t.id !== id; });
    render();
  }

  addBtn.addEventListener("click", addTask);
  taskInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") addTask();
  });

  filterBtns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      filterBtns.forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>

</body>
</html>
